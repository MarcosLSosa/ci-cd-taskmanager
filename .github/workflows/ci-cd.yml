name: CI-CD TaskManager

on:
  push:
    branches:
      - main

jobs:
  build-test-deploy:
    runs-on: self-hosted

    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependencias
        run: python -m pip install -r requirements.txt

      - name: Ejecutar tests
        run: python -m pytest -v

      - name: Desplegar aplicacion
        run: docker compose up -d --build

      - name: Verificar aplicacion
        run: |
          for i in {1..15}; do
            if curl --fail --silent http://localhost:8080/health; then
              echo ""
              echo "Aplicacion funcionando correctamente."
              exit 0
            fi
            echo "Esperando aplicacion... intento $i/15"
            sleep 2
          done
          echo "ERROR: La aplicacion no respondio."
          docker compose logs --tail=80 taskmanager
          exit 1
